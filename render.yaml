services:
  - type: web
    name: xyz-telegram-bot-hosting
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: UPLOAD_OWNER_ONLY
        value: "true"
      - key: MAX_BOT_FILE_MB
        value: "2"
